<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<style>

/* ===== ESTILOS GENERALES ===== */

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial, Helvetica, sans-serif;
    background:#eef3f8;
    color:#222;
}

/* ===== ENCABEZADO ===== */

header{
    background:#172b4d;
    color:white;
    text-align:center;
    padding:35px;
}

header h1{
    font-size:40px;
    margin:0;
}

header p{
    font-size:18px;
}


/* ===== MENÚ DE NAVEGACIÓN ===== */

nav{
    background:#0d6efd;
    text-align:center;
    padding:15px;
}

nav a{
    color:white;
    text-decoration:none;
    margin:15px;
    font-weight:bold;
}

nav a:hover{
    color:#ffd700;
}


/* ===== CONTENIDO ===== */

main{
    width:90%;
    max-width:1000px;
    margin:30px auto;
    background:white;
    padding:25px;
    border-radius:15px;
}


h2{
    color:#172b4d;
    border-bottom:3px solid #0d6efd;
    padding-bottom:10px;
}


p{
    line-height:1.6;
}


/* ===== IMÁGENES ===== */

img{
    width:500px;
    max-width:100%;
    display:block;
    margin:20px auto;
    border-radius:15px;
}


/* ===== LISTAS ===== */

ul,ol{
    padding:20px;
}


li{
    margin:10px;
}


/* ===== TABLAS ===== */

table{
    width:100%;
    border-collapse:collapse;
    margin-top:20px;
}


th{
    background:#172b4d;
    color:white;
}


th,td{
    border:1px solid #999;
    padding:12px;
}


/* ===== FORMULARIOS ===== */

form{
    display:flex;
    flex-direction:column;
    gap:12px;
}


input,select,textarea{
    padding:12px;
    border:1px solid #aaa;
    border-radius:8px;
    font-size:16px;
}


button{
    background:#0d6efd;
    color:white;
    padding:12px;
    border:none;
    border-radius:8px;
    cursor:pointer;
}


button:hover{
    background:#084298;
}


/* ===== PIE DE PÁGINA ===== */

footer{
    background:#172b4d;
    color:white;
    text-align:center;
    padding:20px;
    margin-top:30px;
}


/* ===== CELULARES ===== */

@media(max-width:700px){

nav a{
    display:block;
    margin:10px;
}

header h1{
    font-size:28px;
}

main{
    width:95%;
}

table{
    font-size:14px;
}

}

</style>
<body>

<header>
    <h1>Contacto</h1>
    <p>Envíanos tus preguntas sobre Inteligencia Artificial</p>
</header>

<nav>
    <a href="index.html">Inicio</a>
    <a href="historia.html">Historia</a>
    <a href="aplicaciones.html">Aplicaciones</a>
    <a href="ventajas.html">Ventajas</a>
    <a href="contacto.html">Contacto</a>
</nav>

<main>

    <h2>Formulario de contacto</h2>

    <form>

        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" name="nombre"
               placeholder="Escribe tu nombre" required>

        <label for="correo">Correo electrónico:</label>
        <input type="email" id="correo" name="correo"
               placeholder="ejemplo@correo.com" required>

        <label for="tema">Tema:</label>

        <select id="tema" name="tema">
            <option value="general">Información general</option>
            <option value="historia">Historia de la IA</option>
            <option value="aplicaciones">Aplicaciones</option>
            <option value="ventajas">Ventajas y desafíos</option>
        </select>

        <label for="mensaje">Mensaje:</label>

        <textarea id="mensaje" name="mensaje"
                  rows="6"
                  placeholder="Escribe tu mensaje"></textarea>

        <label>
            <input type="checkbox" name="aceptar">
            Acepto enviar este formulario.
        </label>

        <button type="submit">Enviar</button>
        <button type="reset">Limpiar</button>

    </form>

</main>

<footer>
    <p>Formulario educativo</p>
</footer>

</body>
</html>
